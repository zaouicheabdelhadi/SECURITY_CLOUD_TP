---
- name: Adding aliases
  loop: "{{ aliases | dict2items }}"
  lineinfile:
    path: /etc/hosts
    line: "{{ item.value }} {{ item.key }}"

- name: Install packet crafting / recon tooling
  apt:
    name:
      - nmap
      - tcpdump
      - tshark
      - python3-scapy
      - netcat-openbsd
      - openssh-client
      - telnet
    update_cache: yes

- name: Create scripts directory for Scapy skeletons
  file:
    path: /home/seed/scripts
    state: directory
    owner: seed
    group: seed
    mode: '0755'

- name: Drop Scapy skeleton scripts (students must fill in the blanks themselves)
  copy:
    src: "{{ item }}"
    dest: "/home/seed/scripts/{{ item }}"
    owner: seed
    group: seed
    mode: '0644'
  loop:
    - synflood_skeleton.py
    - rst_attack_skeleton.py
    - hijack_skeleton.py

- name: Drop a short Scapy cheat-sheet
  copy:
    dest: /home/seed/scapy_cheatsheet.txt
    owner: seed
    group: seed
    mode: '0644'
    content: |
      Quick reminders (full syntax is on you - this is NOT the full answer):

      Start interactive Scapy:   sudo scapy
      Run a script:              sudo python3 /home/seed/scripts/<name>.py

      Sniff live traffic (stop with count or Ctrl+C):
        sniff(iface="eth0", filter="tcp and host <ip>", count=20)

      Read one captured packet's seq/ack/source port:
        pkt = sniff(iface="eth0", filter="tcp and port <port>", count=1)[0]
        pkt[TCP].seq, pkt[TCP].ack, pkt[TCP].sport

      Build and send a single spoofed TCP packet:
        ip  = IP(src="...", dst="...")
        tcp = TCP(sport=..., dport=..., flags="...", seq=..., ack=...)
        pkt = ip/tcp            # add "/data" for session hijacking payloads
        send(pkt, verbose=0)

      Flood many SYNs in a loop (needed since one packet does nothing):
        for i in range(2000):
            send(IP(dst="...")/TCP(sport=RandShort(), dport=..., flags="S"), verbose=0)

      RST flag  = "R"   SYN flag = "S"   PSH+ACK = "PA"

      Scripts in /home/seed/scripts/ are skeletons from the SEED Labs PDF,
      adapted to this sandbox - every @@@@ is something YOU must work out
      from your own recon (IP, port, seq/ack...), nothing is filled in for you.
