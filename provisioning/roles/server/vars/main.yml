# --- Accounts -----------------------------------------------------------
# Diagnostic SSH account: given to students in the level text so they can
# log in and check server-side state (netstat, sysctl) after each attack,
# exactly like the "admin" account in the junior-hacker scenario.
diag_user: seedlab
diag_password: 'Att@ckTCP25'

# Telnet victim account: this is the account the "client" machine keeps a
# permanent telnet session open with. Its credentials are NOT given to
# students - it only matters because its session is what gets RST'd /
# hijacked.
telnet_user: victim
telnet_password: 'VictimPass2025'

# --- Custom, non-default values (deliberately different from the SEED
#     Labs handout so answers can't be copy/pasted from the PDF) --------
telnet_port: 2323
radio_stream_port: 9091
# Kept deliberately SMALL: the SEED Labs PDF itself warns that Scapy's
# packet rate is much lower than netwox's, so with this sandbox being
# Scapy-only, a large (realistic) backlog would never fill in reasonable
# time. 8 is still a custom, non-default value students must read via
# sysctl - it is NOT the point of the exercise to guess a huge number.
syn_backlog: 8

